    <!-- No-flash theme: apply saved/system theme class before first paint. -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("theme");
          var dark =
            stored === "dark" ||
            ((!stored || stored === "system") &&

          if (dark) document.documentElement.classList.add("dark");
        } catch (e) {}
      })();
