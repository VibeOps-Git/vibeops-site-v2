name: Create Blog Post

on:
  issues:
    types: [opened, labeled]

jobs:
  create-blog-post:
    if: contains(github.event.issue.labels.*.name, 'blog')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Parse issue body
        id: parse
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.issue.body;

            function getField(label) {
              // Issue form fields appear as "### Label\n\nValue"
              const regex = new RegExp(`### ${label}\\s*\\n\\n([\\s\\S]*?)(?=\\n### |$)`);
              const match = body.match(regex);
              const value = match ? match[1].trim() : '';
              // GitHub renders blank optional fields as "_No response_"
              return value === '_No response_' ? '' : value;
            }

            const title = getField('Blog Title');
            const rawSlug = getField('URL Slug \\(optional\\)');
            const description = getField('Meta Description');
            const ogImage = getField('Social Sharing Image URL \\(optional\\)');
            const content = getField('Blog Content \\(Markdown\\)');

            // Auto-generate slug from title if not provided
            const slug = (rawSlug || title)
              .toLowerCase()
              .replace(/[^a-z0-9]+/g, '-')
              .replace(/^-+|-+$/g, '');

            if (!title || !description || !content) {
              core.setFailed('Missing required fields in issue body');
              return;
            }

            core.setOutput('title', title);
            core.setOutput('slug', slug);
            core.setOutput('description', description);
            core.setOutput('og_image', ogImage);
            core.setOutput('content', content);

      - name: Create MDX file
        uses: actions/github-script@v7
        env:
          BLOG_TITLE: ${{ steps.parse.outputs.title }}
          BLOG_SLUG: ${{ steps.parse.outputs.slug }}
          BLOG_DESCRIPTION: ${{ steps.parse.outputs.description }}
          BLOG_OG_IMAGE: ${{ steps.parse.outputs.og_image }}
          BLOG_CONTENT: ${{ steps.parse.outputs.content }}
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const title = process.env.BLOG_TITLE;
            const slug = process.env.BLOG_SLUG;
            const description = process.env.BLOG_DESCRIPTION;
            const ogImage = process.env.BLOG_OG_IMAGE;
            const content = process.env.BLOG_CONTENT;

            const escapedTitle = title.replace(/\\/g, '\\\\').replace(/"/g, '\\"');
            const escapedDesc = description.replace(/\\/g, '\\\\').replace(/"/g, '\\"');

            const metaLines = [
              `export const meta = {`,
              `  title: "${escapedTitle} | VibeOps Technologies",`,
              `  description: "${escapedDesc}",`,
            ];

            if (ogImage) {
              const escapedOg = ogImage.replace(/\\/g, '\\\\').replace(/"/g, '\\"');
              metaLines.push(`  ogImage: "${escapedOg}",`);
            }

            metaLines.push(`}`);

            const mdx = [
              ...metaLines,
              ``,
              `# ${title}`,
              ``,
              content,
              ``,
            ].join('\n');

            const filePath = path.join('src', 'pages', 'blogs', `${slug}.mdx`);
            fs.writeFileSync(filePath, mdx);

            console.log(`Created ${filePath}`);

      - name: Create Pull Request
        id: create-pr
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.PAT_TOKEN }}
          commit-message: "blog: add ${{ steps.parse.outputs.slug }}"
          branch: blog/${{ steps.parse.outputs.slug }}
          title: "Blog: ${{ steps.parse.outputs.title }}"
          body: |
            ## New Blog Post

            Closes #${{ github.event.issue.number }}

            - **Title:** ${{ steps.parse.outputs.title }}
            - **Slug:** `/blog/${{ steps.parse.outputs.slug }}`
            - **Description:** ${{ steps.parse.outputs.description }}

            > Review the generated `.mdx` file, then merge to publish.
          labels: blog

      - name: Comment on issue
        uses: actions/github-script@v7
        env:
          BLOG_SLUG: ${{ steps.parse.outputs.slug }}
        with:
          script: |
            const slug = process.env.BLOG_SLUG;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `A pull request has been created for this blog post. Once reviewed and merged, it will be live at \`/blog/${slug}\`.`
            });
